# A local Quai: the server and a worker, PostgreSQL, and Gitea holding the example repository.
#
#   docker compose up --build
#
# Then open http://localhost:8080 and sign in as one of the demo users; Gitea is at
# http://localhost:3000 (quai/infra-live). QUAI_PORT and GITEA_PORT choose other ports. For
# local use only: PostgreSQL trusts the compose network and is not published, and Gitea's
# account gets a random password at first start. `docker compose down -v` starts over.
name: quai

x-quai: &quai
  image: quai:local
  build: { context: ., args: { VERSION: local } }
  entrypoint: ["/bin/sh", "/etc/quai/run-quai.sh"]
  read_only: true
  tmpfs: [/tmp]
  volumes:
    - ./deploy/compose/quai.yaml:/etc/quai/quai.yaml:ro
    - ./deploy/compose/repositories.yaml:/etc/quai/repositories.yaml:ro
    - ./deploy/compose/run-quai.sh:/etc/quai/run-quai.sh:ro
    - seed:/run/quai:ro

services:
  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: quai
      POSTGRES_DB: quai
      POSTGRES_HOST_AUTH_METHOD: trust # reachable from this compose network only
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "quai", "-d", "quai"]
      interval: 2s
      retries: 30

  gitea:
    image: gitea/gitea:1.27.3@sha256:87a67ee09d3ae0d1df5fda5dcda3e2a1f9236a45b0a59025d6e00e46adc43bef
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://localhost:${GITEA_PORT:-3000}/ # the links in Quai's pages
      GITEA__server__HTTP_PORT: "3000"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__security__ALLOWED_HOST_LIST: server # webhooks reach Quai's server, and nothing else
    ports: ["${GITEA_PORT:-3000}:3000"]
    volumes: [gitea:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 2s
      retries: 60

  seed:
    image: gitea/gitea:1.27.3@sha256:87a67ee09d3ae0d1df5fda5dcda3e2a1f9236a45b0a59025d6e00e46adc43bef
    entrypoint: ["/bin/sh", "/seed-gitea.sh"]
    depends_on: { gitea: { condition: service_healthy } }
    volumes:
      - gitea:/data
      - seed:/run/quai
      - ./deploy/compose/seed-gitea.sh:/seed-gitea.sh:ro
      - ./examples/gitops-repo:/seed/gitops-repo:ro
    restart: "no"

  migrate:
    <<: *quai
    command: ["migrate"]
    depends_on:
      postgres: { condition: service_healthy }
      seed: { condition: service_completed_successfully }
    restart: "no"

  server:
    <<: *quai
    command: ["server"]
    ports: ["${QUAI_PORT:-8080}:8080"]
    volumes:
      - ./deploy/compose/quai.yaml:/etc/quai/quai.yaml:ro
      - ./deploy/compose/repositories.yaml:/etc/quai/repositories.yaml:ro
      - ./deploy/compose/run-quai.sh:/etc/quai/run-quai.sh:ro
      - seed:/run/quai:ro
      - server-cache:/var/cache/quai
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 2s
      retries: 30

  worker:
    <<: *quai
    command: ["worker"]
    volumes:
      - ./deploy/compose/quai.yaml:/etc/quai/quai.yaml:ro
      - ./deploy/compose/repositories.yaml:/etc/quai/repositories.yaml:ro
      - ./deploy/compose/run-quai.sh:/etc/quai/run-quai.sh:ro
      - seed:/run/quai:ro
      - worker-cache:/var/cache/quai
    depends_on: { migrate: { condition: service_completed_successfully } }

  # The end-to-end scenarios (e2e/), in a browser on this network, once the stack is up:
  #   docker compose --profile e2e run --rm e2e
  e2e:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    environment:
      E2E_BASE_URL: http://server:8080
      E2E_GITEA_URL: http://gitea:3000 # the scenarios read pull requests and statuses there
      E2E_GITEA_TOKEN_FILE: /run/quai/git-token
      E2E_OUTPUT: /tmp/e2e # copy it out with docker cp to read the report
      CI: ${CI:-}
    volumes: [./e2e:/src:ro, seed:/run/quai:ro]
    shm_size: 1gb # Chromium's shared memory
    command: ["sh", "-c", "mkdir -p /e2e && cp -R /src/. /e2e && cd /e2e && npm ci --no-audit --no-fund && npx playwright test"]
    depends_on:
      server: { condition: service_healthy }
      worker: { condition: service_started }

volumes:
  postgres:
  gitea:
  seed:
  server-cache:
  worker-cache:
