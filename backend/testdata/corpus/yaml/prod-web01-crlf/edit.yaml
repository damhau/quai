# A CRLF file with comments: goccy counts an extra line after each comment in CRLF files, so
# positions come from an LF view and edits are mapped back; line breaks stay CRLF (found by the
# real-world sweep).
set:
  - path: [cpu]
    value: 8
  - path: [tags, env]
    value: prod
delete:
  - path: [backup_policy]
