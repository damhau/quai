{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "quai.fullname" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "quai.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Before the new server and worker start; migrations stay compatible with the previous
    # release, so a rolling upgrade can run old and new pods side by side.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: {{- include "quai.selector" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      # Before installing, the release's other objects (its configuration, its service account)
      # do not exist yet: the migrations need the database alone.
      {{- include "quai.pod" (dict "root" . "hook" true) | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "quai.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env: {{- include "quai.env" . | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.network.caBundle.configMap }}
          volumeMounts:
            - { name: ca, mountPath: /etc/quai-ca, readOnly: true }
          {{- end }}
      {{- with .Values.network.caBundle.configMap }}
      volumes:
        - name: ca
          configMap: { name: {{ . }} }
      {{- end }}
{{- end }}
