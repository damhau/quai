{{- if .Values.secretStore.kubernetes.enabled }}
# Lets Quai resolve k8s: secret references in the release's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "quai.fullname" . }}-secrets
  labels: {{- include "quai.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    {{- with .Values.secretStore.kubernetes.secretNames }}
    resourceNames: {{- toYaml . | nindent 6 }}
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "quai.fullname" . }}-secrets
  labels: {{- include "quai.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "quai.fullname" . }}-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "quai.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
