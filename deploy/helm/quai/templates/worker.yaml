apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quai.fullname" . }}-worker
  labels: {{- include "quai.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {{- include "quai.selector" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "quai.selector" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        # Repositories in the configuration are reconciled at start-up: a change restarts the pods.
        checksum/config: {{ list .Values.config .Values.repositories | toYaml | sha256sum }}
    spec:
      {{- include "quai.pod" (dict "root" .) | nindent 6 }}
      containers:
        - name: worker
          {{- include "quai.container" (dict "root" . "command" "worker") | nindent 10 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        {{- include "quai.volumes" (dict "root" . "sizeLimit" .Values.worker.cache.sizeLimit) | nindent 8 }}
