apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quai.fullname" . }}-server
  labels: {{- include "quai.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  {{- if not .Values.server.autoscaling.enabled }}
  replicas: {{ .Values.server.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "quai.selector" (dict "root" . "component" "server") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "quai.selector" (dict "root" . "component" "server") | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml .Values.config | sha256sum }}
    spec:
      {{- include "quai.pod" (dict "root" .) | nindent 6 }}
      containers:
        - name: server
          {{- include "quai.container" (dict "root" . "command" "server") | nindent 10 }}
          ports:
            - { name: http, containerPort: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources: {{- toYaml .Values.server.resources | nindent 12 }}
      volumes:
        {{- include "quai.volumes" (dict "root" . "sizeLimit" "") | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quai.fullname" . }}
  labels: {{- include "quai.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "quai.selector" (dict "root" . "component" "server") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
{{- if .Values.server.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "quai.fullname" . }}-server
  labels: {{- include "quai.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.server.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "quai.selector" (dict "root" . "component" "server") | nindent 6 }}
{{- end }}
{{- if .Values.server.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "quai.fullname" . }}-server
  labels: {{- include "quai.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "quai.fullname" . }}-server }
  minReplicas: {{ .Values.server.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.server.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.server.autoscaling.targetCPUUtilizationPercentage }} } }
{{- end }}
