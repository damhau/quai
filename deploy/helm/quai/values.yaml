# Quai's chart (docs/operations/deployment-and-operations.md#helm): server and worker
# Deployments, the migrations as a hook Job, the configuration file, and the secrets it refers
# to. PodDisruptionBudgets, autoscaling, ingress and the alerts are optional. CI installs it on
# kind with deploy/kind/values.yaml.

image:
  repository: ghcr.io/damhau/quai
  tag: "" # the chart's appVersion when empty
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The configuration file, quai.yaml, as YAML. Secrets do not belong here: the database URL and
# the OIDC client secret come from Secrets below. Repository URLs may carry a token for now; put
# such a configuration in a Secret and name it in configSecret instead.
config:
  env: production
  auth:
    mode: oidc
    oidc:
      issuer: https://login.example.com/realms/acme
      clientID: quai
      redirectURL: https://quai.example.com/auth/callback
    roles:
      - { group: platform-admins, role: platform-admin, scope: global }
    # Teams own resources. Without teams, each group is the team of its own name; with it, only
    # the groups an entry matches are teams, the first match deciding; a last entry
    # { group: "*", team: "*" } keeps the others as the teams of their names
    # (docs/operations/deployment-and-operations.md#people-and-teams).
    # teams:
    #   - { group: sg-quai-*, team: "*" }
  # The audit log (docs/operations/deployment-and-operations.md#the-checkpoint-key): the worker
  # signs a checkpoint every hour with an Ed25519 key from a Secret, and prunes what the retention
  # lets go. Without a key, it warns: nothing is pruned, and a rewritten chain goes unnoticed.
  # audit:
  #   retention: 8760h
  #   checkpoints:
  #     signingKey: { ref: "k8s:quai/quai-audit-key#private.pem" }
  #     repository: audit-log # a connection with delivery mode direct, to commit checkpoints to
  #   # The SIEMs the worker sends the audit log to (docs/operations/deployment-and-operations.md#exporting-to-a-siem):
  #   # syslog over TLS, OpenTelemetry logs or Splunk's HTTP Event Collector, verified with the
  #   # image's CAs and network.caBundle.
  #   export:
  #     - { name: siem, syslog: { address: "siem.example.com:6514" } }
  #     - name: splunk
  #       splunk: { url: "https://splunk.example.com:8088", token: { ref: "k8s:quai/quai-splunk#token" }, index: audit }
  # Notifications by email (docs/operations/deployment-and-operations.md#notifications): the
  # worker mails requesters, the approvers a request waits for and, of alerts, the repositories'
  # admins and notifications.alerts. Mail goes over TLS only, implicit (tls, port 465) or
  # STARTTLS (starttls, port 587, refused when the server does not offer it), verified with the
  # image's CAs and network.caBundle. The links in it start with server.publicURL, which email
  # requires.
  # server:
  #   publicURL: https://quai.example.com
  # notifications:
  #   email:
  #     host: smtp.example.com
  #     port: 587
  #     transport: starttls
  #     from: "Quai <quai@example.com>"
  #     username: quai
  #     password: { ref: "k8s:quai/quai-smtp#password" }
  #   alerts: [platform-team@example.com]
configSecret: "" # an existing Secret with the quai.yaml and repositories.yaml keys, used instead of config and repositories

# The repository connections declared here: Repository documents
# (docs/design/01-repository-connections.md), reconciled into the database when the pods start.
# Connections can also be managed through the API.
repositories: []
# - apiVersion: quai.dev/v1beta1
#   kind: Repository
#   metadata: { name: infra-live, title: Infrastructure }
#   spec:
#     connector: azure-devops
#     url: https://devops.acme.ch/tfs/DefaultCollection/Infrastructure/_git/live
#     enforcement:
#       floorRules: [{ name: production-floor, when: "params.env == 'prod'", approvers: [group:platform-admins] }]

# Existing Secrets the processes read their secrets from.
database:
  # The server and the worker connect as an application role, which the migrations grant what
  # it needs: the audit log to read and append only.
  secretName: quai-database # key: url, such as postgres://quai_app:…@db:5432/quai
  secretKey: url
  # The migrations Job alone connects as the schema's owner, from a Secret of its own
  # (database.migrateURL). Empty: the migrations connect with the URL above, a single role that
  # can change or delete audit events, which Quai warns about.
  migrate:
    secretName: quai-database-owner # key: url, such as postgres://quai:…@db:5432/quai
    secretKey: url
oidc:
  secretName: quai-oidc # key: clientSecret
  secretKey: clientSecret

# Where secret references resolve. Repository connections name their credentials, webhook secret
# and run token as references: env:NAME (the pods' environment) or k8s:<namespace>/<name>#<key>.
secretStore:
  kubernetes:
    # A Role lets the pods read the Secrets of the release's namespace; list their names to
    # restrict it to those, and keep the schema owner's Secret (database.migrate) out of the
    # pods' reach. The annotation quai.dev/expires-at (RFC 3339) on a Secret makes Quai warn 30
    # days before it expires.
    enabled: true
    secretNames: []

# Outgoing connections: Git, the platforms' APIs, the identity provider, traces. Certificate
# verification is never turned off.
network:
  # CA certificates trusted in addition to the image's (an internal CA, typically), in PEM, from
  # an existing ConfigMap.
  caBundle:
    configMap: ""
    key: ca.crt
  # The HTTP proxy, as HTTPS_PROXY, HTTP_PROXY and NO_PROXY. With a proxy, noProxy must cover the
  # Kubernetes API when the secret store reads Kubernetes Secrets: .svc,.cluster.local and the
  # service network, such as 10.96.0.0/12.
  proxy:
    https: ""
    http: ""
    noProxy: ""

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

server:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }
  pdb: { enabled: true, minAvailable: 1 }
  autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70 }

worker:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  # The Git mirror cache, rebuilt from the remotes when empty.
  cache: { sizeLimit: 5Gi }

migrations:
  enabled: true # quai migrate as a pre-install and pre-upgrade hook

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: quai.example.com
  tls: [] # - { secretName: quai-tls, hosts: [quai.example.com] }

# The chart's alerts, as a PrometheusRule of the Prometheus Operator
# (docs/operations/deployment-and-operations.md#observability). Quai sends its metrics over OTLP;
# they reach Prometheus through a collector's Prometheus exporter, which names
# quai.audit.export.lag quai_audit_export_lag_seconds.
prometheusRule:
  enabled: false
  labels: {} # what the Prometheus' ruleSelector matches, such as release: kube-prometheus-stack
  # QuaiAuditExportLagging: a SIEM has not taken the audit events recorded this long ago.
  auditExportLag: { seconds: 600, for: 5m }

nodeSelector: {}
tolerations: []
affinity: {}
