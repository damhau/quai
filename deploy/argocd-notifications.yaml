# Reports Argo CD sync/health back to Quai so the portal shows live status.
# Assumes one Argo CD Application per deployment, named after it (e.g. an
# ApplicationSet with a git directory generator over deployments/*).
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.webhook.quai: |
    url: http://quai.platform.svc:8080/api/webhooks/sync
    headers:
      - name: Authorization
        value: Bearer $quai-webhook-token
      - name: Content-Type
        value: application/json
  template.quai-status: |
    webhook:
      quai:
        method: POST
        body: |
          {
            "deployment": "{{.app.metadata.name}}",
            "revision": "{{.app.status.sync.revision}}",
            "sync": "{{.app.status.sync.status}}",
            "health": "{{.app.status.health.status}}",
            "message": "{{.app.status.operationState.message}}"
          }
  trigger.on-quai-change: |
    - when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded', 'Error', 'Failed']
      send: [quai-status]
    - when: app.status.health.status in ['Healthy', 'Degraded', 'Progressing']
      send: [quai-status]
  defaultTriggers: |
    - on-quai-change
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: quai-deployments
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: git@github.com:acme/platform-gitops.git
        revision: main
        directories:
          - path: deployments/*
  template:
    metadata:
      name: "{{.path.basename}}"
      annotations:
        notifications.argoproj.io/subscribe.on-quai-change.quai: ""
    spec:
      project: default
      source:
        repoURL: git@github.com:acme/platform-gitops.git
        targetRevision: main
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.path.basename}}"
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true]
