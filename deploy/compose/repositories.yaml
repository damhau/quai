# The repository connections of the local stack (docker-compose.yml): Repository documents,
# reconciled into the database at start-up. The token the seed step created in Gitea is in the
# environment of Quai's processes (run-quai.sh).
apiVersion: quai.dev/v1beta1
kind: Repository
metadata: { name: infra-live, title: Infrastructure (Terraform) }
spec:
  connector: gitea
  url: http://gitea:3000/quai/infra-live.git
  credentials: { ref: env:QUAI_GITEA_TOKEN }
  defaultBranch: main
  # Pull requests, merged by Quai once approved: main requires quai/approval (seed-gitea.sh).
  delivery: { mode: pull-request, merge: auto, mergeMethod: squash }
  webhooks: { secret: { ref: env:QUAI_WEBHOOK_SECRET } }
  # The fake runner (docker-compose.yml) reports with the run token whose hash this is.
  runner: { reportToken: { ref: env:QUAI_RUN_TOKEN_SHA256 } }
  sync: { pollInterval: 1m }
