# The configuration of the local stack (docker-compose.yml). The repositories are in
# repositories.yaml.
env: development
database:
  # The application role; the migrate service connects as the schema's owner, quai
  # (QUAI_DATABASE_MIGRATE_URL), and grants it the audit log to read and append only.
  url: postgres://quai_app@postgres:5432/quai?sslmode=disable
auth:
  mode: dev # the user switcher, with its demo users: alice (platform admin), bob, carol, fiona
git:
  cacheDir: /var/cache/quai
repositories:
  path: /etc/quai/repositories.yaml
