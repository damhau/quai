name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The compose stack: the server and a worker, PostgreSQL, Gitea seeded with the examples, and
      # the fake runner.
      - run: docker compose up --detach --build --wait --wait-timeout 300 --quiet-pull
      - run: docker compose --profile e2e run --name e2e --quiet-pull e2e
      - if: failure()
        run: |
          mkdir -p e2e-output
          docker cp e2e:/tmp/e2e/. e2e-output/ || true
          docker compose logs --no-color > e2e-output/compose.log
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-output
          path: e2e-output
          retention-days: 14
      - if: always()
        run: docker compose down --volumes --timeout 5
