name: live

# The live tests, nightly and on demand, one job per sandbox.
#
# azure-devops, on the Azure DevOps sandbox (docs/plan/phase-1-backlog.md#test-infrastructure): the
# connector's conformance suite, webhooks replayed from the sandbox, the scenarios that follow a
# request through its pull request (pending status, approval, auto-complete), and pipelines on the
# sandbox's hosted agents. It needs the AZURE_DEVOPS_PAT repository secret.
#
# github, on the GitHub sandbox (docs/plan/phase-3-backlog.md#test-infrastructure): the sandbox's
# helpers, the connector's conformance suite and live tests (auto-merge, the merge queue, webhooks
# replayed from the app's delivery history), and Quai's GitHub tests in api and ingest (enforcement
# recorded, the access test, trust, delivery through auto-merge and the queue, webhooks replayed to
# Quai). It needs the QUAI_TEST_GITHUB_APP_KEY and QUAI_TEST_GITHUB_WEBHOOK_SECRET repository
# secrets. The suite's step 4 also needs a second app, which publishes the check where only the
# Quai app may: the QUAI_TEST_GITHUB_OTHER_APP_KEY secret, and its IDs set below. Without them it
# skips, and the job's notice names what skipped.
#
# Without its secrets, a job says so in a notice and does nothing, so it is green having tested
# nothing: read the run's annotations before calling it a pass.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: they share the sandbox organizations.
concurrency:
  group: live
  cancel-in-progress: false

jobs:
  azure-devops:
    runs-on: ubuntu-latest
    env:
      HAS_PAT: ${{ secrets.AZURE_DEVOPS_PAT != '' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - if: env.HAS_PAT != 'true'
        working-directory: .
        run: |
          echo "::notice::No AZURE_DEVOPS_PAT secret: the live tests did not run."
      - if: env.HAS_PAT == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.HAS_PAT == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - if: env.HAS_PAT == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/quai
          key: test-binaries-${{ runner.os }}-${{ hashFiles('backend/internal/pgtest/*.go', 'backend/internal/k8stest/*.go', 'backend/internal/giteatest/*.go', 'backend/go.sum') }}
          restore-keys: test-binaries-${{ runner.os }}-
      # The tests read the PAT from a file only; it is never on a command line.
      - if: env.HAS_PAT == 'true'
        name: The PAT, in a file only this job reads
        env:
          PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: |
          umask 077
          printf '%s' "$PAT" > "$RUNNER_TEMP/azure-devops-pat"
      - if: env.HAS_PAT == 'true'
        name: Live tests on the sandbox
        env:
          QUAI_TEST_AZURE_DEVOPS_PAT_FILE: ${{ runner.temp }}/azure-devops-pat
          QUAI_TEST_AZURE_DEVOPS_URL: https://dev.azure.com/dh-consulting/quai-sandbox
        run: go test -count=1 -timeout 30m ./internal/adotest/... ./internal/connectors/azuredevops/... ./internal/ingest/... ./internal/api/...
      - if: always() && env.HAS_PAT == 'true'
        run: rm -f "$RUNNER_TEMP/azure-devops-pat"

  github:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.QUAI_TEST_GITHUB_APP_KEY != '' && secrets.QUAI_TEST_GITHUB_WEBHOOK_SECRET != '' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - if: env.HAS_KEY != 'true'
        working-directory: .
        run: |
          echo "::notice::No QUAI_TEST_GITHUB_APP_KEY or QUAI_TEST_GITHUB_WEBHOOK_SECRET secret: the GitHub live tests did not run."
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.HAS_KEY == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - if: env.HAS_KEY == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/quai
          key: test-binaries-${{ runner.os }}-${{ hashFiles('backend/internal/pgtest/*.go', 'backend/internal/k8stest/*.go', 'backend/internal/giteatest/*.go', 'backend/go.sum') }}
          restore-keys: test-binaries-${{ runner.os }}-
      # The tests read the key and the secret from files only; they are never on a command line.
      - if: env.HAS_KEY == 'true'
        name: The app's key and webhook secret, in files only this job reads
        env:
          APP_KEY: ${{ secrets.QUAI_TEST_GITHUB_APP_KEY }}
          WEBHOOK_SECRET: ${{ secrets.QUAI_TEST_GITHUB_WEBHOOK_SECRET }}
          OTHER_APP_KEY: ${{ secrets.QUAI_TEST_GITHUB_OTHER_APP_KEY }}
        run: |
          umask 077
          printf '%s' "$APP_KEY" > "$RUNNER_TEMP/github-app.pem"
          printf '%s' "$WEBHOOK_SECRET" > "$RUNNER_TEMP/github-webhook-secret"
          if [ -n "$OTHER_APP_KEY" ]; then
            printf '%s' "$OTHER_APP_KEY" > "$RUNNER_TEMP/github-other-app.pem"
          fi
      # bash, for pipefail: go test's failure must survive tee. The notice says what ran, since go
      # test reports a package as ok whether its tests passed or were skipped. It counts subtests
      # too and names each one skipped: the conformance suite's steps are subtests, so a suite with
      # most of its steps skipped still passes at the top level.
      - if: env.HAS_KEY == 'true'
        name: Live tests on the sandbox
        shell: bash
        env:
          QUAI_TEST_GITHUB_APP_KEY_FILE: ${{ runner.temp }}/github-app.pem
          QUAI_TEST_GITHUB_WEBHOOK_SECRET_FILE: ${{ runner.temp }}/github-webhook-secret
          QUAI_TEST_GITHUB_ORG: damhau-quai-sandbox
          QUAI_TEST_GITHUB_APP_ID: "5656119"
          QUAI_TEST_GITHUB_INSTALLATION_ID: "179566659"
          # The second app, for the conformance suite's step 4: its key, when the secret is set, and
          # its IDs, to set when it is created (the tests stop if the key comes without them).
          QUAI_TEST_GITHUB_OTHER_APP_KEY_FILE: ${{ secrets.QUAI_TEST_GITHUB_OTHER_APP_KEY != '' && format('{0}/github-other-app.pem', runner.temp) || '' }}
          # QUAI_TEST_GITHUB_OTHER_APP_ID: "<the second app's ID>"
          # QUAI_TEST_GITHUB_OTHER_INSTALLATION_ID: "<its installation's ID on damhau-quai-sandbox>"
        run: |
          go test -count=1 -v -timeout 30m ./internal/githubtest/... ./internal/connectors/github/... | tee "$RUNNER_TEMP/github-live.log"
          go test -count=1 -v -timeout 20m -run GitHub ./internal/api/... ./internal/ingest/... | tee -a "$RUNNER_TEMP/github-live.log"
          echo "::notice::GitHub live tests on $QUAI_TEST_GITHUB_ORG, subtests included: $(grep -cE '^ *--- PASS' "$RUNNER_TEMP/github-live.log") passed, $(grep -cE '^ *--- SKIP' "$RUNNER_TEMP/github-live.log") skipped: $(grep -E '^ *--- SKIP' "$RUNNER_TEMP/github-live.log" | awk '{print $3}' | paste -sd ' ' -)."
      - if: always() && env.HAS_KEY == 'true'
        working-directory: .
        run: rm -f "$RUNNER_TEMP/github-app.pem" "$RUNNER_TEMP/github-webhook-secret" "$RUNNER_TEMP/github-other-app.pem" "$RUNNER_TEMP/github-live.log"
