name: frontend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: npm ci
      # Known vulnerabilities of high severity in any dependency, development ones included,
      # fail the build; lower ones are reported.
      - run: npm audit --audit-level=high
      # The committed OpenAPI document, generated client, route tree and CEL conformance cases
      # must match the backend and the routes.
      - name: Generated code is up to date
        run: |
          npm run api:openapi
          npm run api:gen
          npm run routes:gen
          npm run cel:cases
          git diff --exit-code -- openapi.json src/api/generated src/routeTree.gen.ts src/lib/cel/conformance.json
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
