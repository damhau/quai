name: packaging

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint deploy/helm/quai
      # Every optional object rendered, and checked against the Kubernetes schemas.
      - run: |
          helm template quai deploy/helm/quai --set server.autoscaling.enabled=true --set ingress.enabled=true > rendered.yaml
          docker run --rm -v "$PWD:/work:ro" ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c -strict -summary /work/rendered.yaml
      - run: docker compose config --quiet

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: VERSION=${{ github.sha }}
          tags: quai:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image starts, serves its embedded frontend and answers its health check.
      - run: |
          docker run -d --name quai -p 8080:8080 quai:ci server
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          docker logs quai
