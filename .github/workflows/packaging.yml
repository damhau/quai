name: packaging

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint deploy/helm/quai
      # Every optional object rendered, and checked against the Kubernetes schemas.
      - run: |
          helm template quai deploy/helm/quai --set server.autoscaling.enabled=true --set ingress.enabled=true > rendered.yaml
          docker run --rm -v "$PWD:/work:ro" ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c -strict -summary /work/rendered.yaml
      - run: docker compose config --quiet

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # to push the image, on main only
      id-token: write # to sign it keylessly with the workflow's identity, on main only
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: VERSION=${{ github.sha }}
          tags: quai:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image starts, serves its embedded frontend and answers its health check.
      - run: |
          docker run -d --name quai -p 8080:8080 quai:ci server
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          docker logs quai
      # What the image holds, as a CycloneDX SBOM kept with the run.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: quai:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: quai.cdx.json
      # Known vulnerabilities with a fix, of high or critical severity, fail the build.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: quai:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # On main, the image that was scanned is published, signed keylessly (Sigstore, with this
      # workflow's identity) and its SBOM attested.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push
        run: |
          docker tag quai:ci "$IMAGE:sha-$GITHUB_SHA"
          docker tag quai:ci "$IMAGE:main"
          docker push --quiet "$IMAGE:sha-$GITHUB_SHA"
          docker push --quiet "$IMAGE:main"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA")
          echo "ref=${digest}" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"
