name: plugins

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The plugin SDK, the template and the example INI plugin (docs/engineering/plugins.md): gofmt,
# go vet and staticcheck natively and for wasip1, their tests, and the template's and the
# example's builds.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false # the modules have no dependencies
      # staticcheck at the backend's pinned version, built by backend/tools/tool.sh: the backend
      # workflow's cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/quai-tools
          key: go-tools-${{ runner.os }}-${{ hashFiles('backend/Makefile', 'backend/go.mod') }}
      - run: make -C plugins check
