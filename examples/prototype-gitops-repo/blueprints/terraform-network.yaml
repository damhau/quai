apiVersion: quai.dev/v1alpha1
kind: Blueprint
metadata:
  name: terraform-network
  title: Cloud network (Terraform)
  description: Exposes an existing Terraform module as a self-service form. Runs through the Flux tf-controller with plan auto-apply outside prod.
  icon: terraform
  category: Network
  owner: network-team
  version: 1.0.0
  tags: [terraform, network]
spec:
  inputs:
    - { name: environment, title: Environment, type: enum, options: [dev, test, prod], default: dev, required: true }
    - { name: region, title: Region, type: enum, options: [eu-central-1, eu-west-1, us-east-1], default: eu-central-1, required: true }
    - { name: cidr, title: VPC CIDR, type: string, required: true, default: 10.20.0.0/16, pattern: "([0-9]{1,3}\\.){3}[0-9]{1,3}/(1[6-9]|2[0-4])" }
    - { name: natGateways, title: NAT gateways, type: integer, min: 0, max: 3, default: 1 }
  approval:
    rules:
      - { name: network-review, approvers: [group:network] }
  resources:
    - id: vpc
      type: terraform.module
      position: { x: 240, y: 120 }
      properties:
        source: terraform-modules
        path: ./modules/vpc
        autoApprove: ${{ inputs.environment != 'prod' }}
        vars:
          name: ${{ deployment.name }}
          region: ${{ inputs.region }}
          cidr: ${{ inputs.cidr }}
          nat_gateways: ${{ inputs.natGateways }}
  actions:
    - name: nat
      title: Change NAT gateways
      inputs:
        - { name: natGateways, title: NAT gateways, type: integer, min: 0, max: 3, required: true }
      set:
        natGateways: ${{ action.natGateways }}
