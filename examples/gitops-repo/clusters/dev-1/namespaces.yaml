# Namespaces on the dev-1 cluster, one entry each; main.tf makes each one a namespace and its
# quota. The platform team reviews new namespaces and quotas that grow.
namespaces:
  - name: shop-dev
    owner: bob
    description: Shop front-end and API
    labels:
      app: shop
    quota:
      cpu: 4
      memory_gi: 8
  # CI jobs of every team: short-lived pods, many of them.
  - name: ci-runners
    owner: alice
    quota:
      cpu: 16
      memory_gi: 32
      pods: 200
