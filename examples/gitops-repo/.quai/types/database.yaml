apiVersion: quai.dev/v1beta1
kind: ResourceType
metadata:
  name: database
  title: Database
  description: A managed database, one item of the databases list in databases/<env>/databases.auto.tfvars.json. The form asks for a size; the template makes its vCPUs, memory and storage from it, and leaves what people added by hand (the engine version, the backup retention) as it is.
  icon: database
  category: Data
  version: 1.0.0
  tags: [terraform, database, shared-file, mapping]
spec:
  locate:
    strategy: entry
    path: databases/{env}/databases.auto.tfvars.json
    collection: databases
    key: name
    keyParam: name
  params:
    - name: env
      title: Environment
      type: enum
      discover: true # the environments that have a database stack
    - name: name
      title: Name
      description: Unique in the environment; becomes the Terraform for_each key.
      pattern: "[a-z][a-z0-9-]{1,30}"
  # The file's contract, and the simpler form the template turns into it.
  schema: catalog/schemas/database.schema.json
  inputs: catalog/schemas/database.form.schema.json
  generate:
    kind: mapping
    template:
      engine: ${{ inputs.engine }}
      vcpu: "${{ inputs.size == 'small' ? 2 : inputs.size == 'medium' ? 4 : 8 }}"
      memory_gb: "${{ inputs.size == 'small' ? 4 : inputs.size == 'medium' ? 16 : 32 }}"
      storage_gb: "${{ inputs.size == 'small' ? 20 : inputs.size == 'medium' ? 100 : 500 }}"
    read:
      # The engine is read back from where the template binds it; the size from the vCPUs.
      size: "${{ doc.vcpu <= 2 ? 'small' : doc.vcpu <= 4 ? 'medium' : 'large' }}"
  # Developers and FinOps see databases in the catalog; developers request them, and only the
  # shop team in prod. Owners keep operating their databases whatever these lists say.
  entitlements:
    visibility: [group:developers, group:finops]
    requesters: [group:developers]
    environments:
      prod: [group:shop]
  ownership: { field: owner }
  stack: databases/{env}
  address: module.database["{name}"]
  deletion: approval
  ui:
    order: [engine, size]
  approval:
    rules:
      - name: production
        when: params.env == 'prod'
        approvers: [group:platform-admins]
      - name: large-database
        # Only when a database becomes large.
        when: inputs.size == 'large' && !(has(previous.size) && previous.size == 'large')
        approvers: [group:finops]
