apiVersion: quai.dev/v1beta1
kind: ResourceType
metadata:
  name: dns-record
  title: DNS record set
  description: A record set of an internal DNS zone, one entry of the records map in dns/<zone>/records.auto.tfvars. The zone's Terraform stack makes each entry an instance of modules/dns-record. A value written as an expression (ttl = 24 * 3600) is defined in code; Quai shows it and leaves it.
  icon: globe
  category: Network
  version: 1.0.0
  tags: [terraform, dns, shared-file]
spec:
  locate:
    strategy: entry
    path: dns/{zone}/records.auto.tfvars
    collection: records
    keyParam: name
  params:
    - name: zone
      title: Zone
      type: enum
      discover: true # the zones that have a stack
    - name: name
      title: Name
      description: The record's name in the zone, one DNS label; becomes the Terraform for_each key.
      pattern: "[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?"
  schema: catalog/schemas/dns-record.schema.json
  generate: { kind: identity }
  ownership: { field: owner }
  stack: dns/{zone}
  address: module.record["{name}"]
  deletion: approval
  ui:
    order: [type, values, ttl]
  approval:
    rules:
      - name: platform
        approvers: [group:platform-admins]
