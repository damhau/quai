apiVersion: quai.dev/v1alpha1
kind: Blueprint
metadata:
  name: web-service
  title: Web service stack
  description: Namespace, an Argo CD application and its PostgreSQL database and bucket, wired together. Built on the designer canvas.
  icon: rocket
  category: Applications
  owner: platform-team
  version: 0.3.0
  tags: [argocd, crossplane]
spec:
  inputs:
    - { name: environment, title: Environment, type: enum, options: [dev, test, prod], default: dev, required: true }
    - { name: chart, title: Helm chart, type: string, default: web-app, required: true }
    - { name: chartVersion, title: Chart version, type: string, default: 1.4.0, pattern: "[0-9]+\\.[0-9]+\\.[0-9]+" }
    - { name: replicas, title: Replicas, type: integer, min: 1, max: 20, default: 2 }
    - { name: withBucket, title: Add object storage, type: boolean, default: false }
  approval:
    rules:
      - { name: production, when: "inputs.environment == 'prod'", approvers: [group:platform-admins] }
  resources:
    - id: ns
      type: k8s.namespace
      position: { x: 40, y: 140 }
      properties:
        cpuQuota: "${{ inputs.environment == 'prod' ? '16' : '4' }}"
        memoryQuota: "${{ inputs.environment == 'prod' ? '32Gi' : '8Gi' }}"
    - id: app
      type: argocd.app
      position: { x: 320, y: 140 }
      properties:
        repoURL: https://charts.example.com
        chart: ${{ inputs.chart }}
        version: ${{ inputs.chartVersion }}
        replicas: ${{ inputs.replicas }}
    - id: db
      type: crossplane.postgres
      position: { x: 620, y: 60 }
      properties:
        size: "${{ inputs.environment == 'prod' ? 'medium' : 'small' }}"
        highAvailability: ${{ inputs.environment == 'prod' }}
    - id: assets
      type: crossplane.bucket
      when: inputs.withBucket
      position: { x: 620, y: 240 }
      properties:
        versioning: true
  connections:
    - { from: app, to: db }
    - { from: app, to: assets }
  actions:
    - name: scale
      title: Scale
      icon: maximize
      inputs:
        - { name: replicas, title: Replicas, type: integer, min: 0, max: 20, required: true }
      set:
        replicas: ${{ action.replicas }}
      approval:
        rules: []
    - name: deploy-version
      title: Deploy chart version
      icon: rocket
      inputs:
        - { name: chartVersion, title: Chart version, type: string, pattern: "[0-9]+\\.[0-9]+\\.[0-9]+", required: true }
      set:
        chartVersion: ${{ action.chartVersion }}
