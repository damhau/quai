apiVersion: quai.dev/v1alpha1
kind: Blueprint
metadata:
  name: postgres
  title: PostgreSQL database
  description: Managed PostgreSQL through a Crossplane claim. Credentials are written to a connection secret in your namespace.
  icon: database
  category: Data
  owner: data-platform
  version: 2.0.1
  tags: [crossplane, database]
spec:
  inputs:
    - { name: environment, title: Environment, type: enum, options: [dev, test, prod], default: dev, required: true }
    - { name: namespace, title: Target namespace, type: string, pattern: "[a-z0-9]([-a-z0-9]*[a-z0-9])?", placeholder: defaults to the deployment name }
    - { name: version, title: PostgreSQL version, type: enum, options: ["15", "16", "17"], default: "16", required: true }
    - { name: size, title: Instance size, type: enum, options: [small, medium, large], default: small, required: true }
    - { name: storageGB, title: Storage (GB), type: integer, min: 10, max: 4096, default: 20 }
    - name: highAvailability
      title: Multi-AZ high availability
      type: boolean
      default: true
      visibleIf: inputs.environment == 'prod'
  approval:
    rules:
      - { name: production, when: "inputs.environment == 'prod'", approvers: [group:platform-admins] }
      - { name: dba-review, when: "inputs.size == 'large' || inputs.storageGB > 500", approvers: [group:dba], min: 1 }
  resources:
    - id: db
      type: crossplane.postgres
      position: { x: 240, y: 120 }
      properties:
        version: ${{ inputs.version }}
        size: ${{ inputs.size }}
        storageGB: ${{ inputs.storageGB }}
        highAvailability: ${{ inputs.highAvailability == true }}
        backupRetentionDays: "${{ inputs.environment == 'prod' ? 30 : 7 }}"
  actions:
    - name: resize-storage
      title: Resize storage
      icon: hard-drive
      inputs:
        - { name: storageGB, title: Storage (GB), type: integer, min: 10, max: 4096, required: true }
      set:
        storageGB: ${{ action.storageGB }}
    - name: upgrade
      title: Upgrade major version
      icon: arrow-up
      inputs:
        - { name: version, title: Target version, type: enum, options: ["16", "17"], required: true }
      set:
        version: ${{ action.version }}
      approval:
        rules:
          - { name: dba-upgrade, approvers: [group:dba] }
