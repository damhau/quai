apiVersion: quai.dev/v1beta1
kind: ResourceType
metadata:
  name: dns-record
  title: DNS record set
  description: A record set of an internal DNS zone, one entry of the records map in stacks/dns/<zone>/records.auto.tfvars. The zone's Terraform stack makes each entry an instance of modules/dns-record, whose variables the schema follows.
  icon: globe
  category: Network
  version: 1.0.0
  tags: [terraform, dns]
spec:
  locate:
    strategy: entry
    path: stacks/dns/{zone}/records.auto.tfvars
    collection: records
    keyParam: name
  params:
    - name: zone
      title: Zone
      type: enum
      discover: true # the zones that have a stack
    - name: name
      title: Name
      description: The record's name in the zone, one DNS label; becomes the Terraform for_each key.
      pattern: "[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?" # modules/dns-record's name validation
  schema: .quai/schemas/dns-record.schema.json
  generate: { kind: identity }
  ownership: { field: owner }
  stack: stacks/dns/{zone}
  address: module.record["{name}"]
  deletion: approval
  ui:
    order: [type, values, ttl]
  approval:
    rules:
      - name: network
        approvers: [group:network]
      - name: external-alias
        # A CNAME that leaves the internal zones.
        when: "inputs.type == 'CNAME' && inputs.values.exists(v, !v.endsWith('.internal.'))"
        approvers: [group:security]
