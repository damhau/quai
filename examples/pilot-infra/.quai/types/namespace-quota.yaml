apiVersion: quai.dev/v1beta1
kind: ResourceType
metadata:
  name: namespace-quota
  title: Namespace quota
  description: The quota of a namespace, which anyone may ask to change without owning the namespace. It writes only the quota of an entry of clusters/<cluster>/namespaces.yaml; the namespace type owns the rest.
  icon: gauge
  category: Kubernetes
  version: 1.0.0
  tags: [terraform, kubernetes]
spec:
  locate:
    strategy: field
    path: clusters/{cluster}/namespaces.yaml
    collection: namespaces
    key: name
    keyParam: name
    fields: [quota]
  params:
    - { name: cluster, title: Cluster, type: enum, discover: true }
    - { name: name, title: Namespace, pattern: "[a-z][a-z0-9-]{1,30}[a-z0-9]" }
  schema: .quai/schemas/namespace-quota.schema.json
  generate: { kind: identity }
  # Who may ask: the namespace's owner is in the entry, outside the quota, so the quotas are the
  # developers' to ask for and the platform team's to grant (below).
  ownership: { team: developers }
  stack: stacks/clusters/{cluster}
  address: module.namespace["{name}"].terraform_data.quota
  approval:
    rules:
      - name: platform
        approvers: [group:platform-admins]
