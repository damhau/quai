apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop-admin
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://git.example.com/shop/admin.git
    targetRevision: v1.4.0
    path: deploy
  destination:
    namespace: shop
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
