apiVersion: database.example.org/v1alpha1
kind: PostgreSQLInstance
metadata:
  name: orders
  namespace: shop
spec:
  parameters:
    highAvailability: false
    storageGB: 50 # about a year of orders
    version: "17"
  compositionSelector:
    matchLabels:
      provider: example
  writeConnectionSecretToRef:
    name: orders-connection
